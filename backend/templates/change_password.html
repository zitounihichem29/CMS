{% extends "base.html" %}

{% block content %}

<div class="change-password-page">

    <div class="change-password-header">

        <div>
            <h1>
                SECURITY
            </h1>

            <span>
                Change Password
            </span>

            <p>
                Update your account password securely.
            </p>
        </div>

        <a href="{{ url_for('settings.settings') }}">
            Back to Settings
        </a>

    </div>


    <!-- =========================================
         MESSAGES
    ========================================== -->

    {% if error %}

        <div class="change-password-message error">

            {{ error }}

        </div>

    {% endif %}


    {% if success %}

        <div class="change-password-message success">

            {{ success }}

        </div>

    {% endif %}


    <!-- =========================================
         FORM
    ========================================== -->

    <form
        method="POST"
        action="{{ url_for('settings.change_password') }}"
        class="change-password-form"
    >

        <div>

            <label for="current_password">
                Current Password
            </label>

            <input
                id="current_password"
                name="current_password"
                type="password"
                autocomplete="current-password"
                required
            >

        </div>


        <div>

            <label for="new_password">
                New Password
            </label>

            <input
                id="new_password"
                name="new_password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <p>
                Minimum 8 characters.
            </p>

        </div>


        <div>

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                id="confirm_password"
                name="confirm_password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
            >

        </div>


        <div class="change-password-actions">

            <a href="{{ url_for('settings.settings') }}">
                Cancel
            </a>

            <button type="submit">
                Change Password
            </button>

        </div>

    </form>

</div>

{% endblock %}
